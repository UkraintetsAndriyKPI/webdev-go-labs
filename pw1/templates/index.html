<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Fuel Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light py-5">

    <div class="container">
        <div class="card shadow-lg rounded-4 p-4 mx-auto" style="max-width: 900px;">
            <h1 class="text-center mb-4">Fuel Calculator</h1>

            <!-- Nav tabs -->
            <ul class="nav nav-tabs mb-4" id="calculatorTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link {{if eq .Tab "1"}}active{{end}}" id="tab1-btn" data-bs-toggle="tab"
                        data-bs-target="#tab1" type="button" role="tab"
                        aria-selected="{{if eq .Tab "1"}}true{{else}}false{{end}}">
                        Calculate 1
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link {{if eq .Tab "2"}}active{{end}}" id="tab2-btn" data-bs-toggle="tab"
                        data-bs-target="#tab2" type="button" role="tab"
                        aria-selected="{{if eq .Tab "2"}}true{{else}}false{{end}}">
                        Calculate 2
                    </button>
                </li>
            </ul>


            <!-- Tab content -->
            <div class="tab-content">
                <!-- FORM 1 -->
                <div class="tab-pane fade {{if eq .Tab "1"}}show active{{end}}" id="tab1" role="tabpanel">
                    <form method="POST" action="/calculate" class="row g-3">
                        <div class="col-md-3"><input type="number" class="form-control" name="HP" placeholder="Hᴾ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="CP" placeholder="Cᴾ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="SP" placeholder="Sᴾ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="NP" placeholder="Nᴾ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="OP" placeholder="Oᴾ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="WP" placeholder="Wᴾ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="AP" placeholder="Aᴾ"
                                required min="0" step="any"></div>

                        <div class="col-12">
                            <button class="btn btn-primary w-100" type="submit">Обчислити</button>
                        </div>
                    </form>
                </div>

                <!-- FORM 2 -->
                <div class="tab-pane fade {{if eq .Tab "2"}}show active{{end}}" id="tab2" role="tabpanel">
                    <form method="POST" action="/calculate2" class="row g-3">
                        <div class="col-md-3"><input type="number" class="form-control" name="HG" placeholder="Hᴳ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="CG" placeholder="Cᴳ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="SG" placeholder="Sᴳ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="NG" placeholder="Nᴳ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="OG" placeholder="Oᴳ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="WG" placeholder="Wᴳ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="AG" placeholder="Aᴳ"
                                required min="0" step="any"></div>
                        <div class="col-md-3"><input type="number" class="form-control" name="QI" placeholder="Qᴵ"
                                required min="0" step="any"></div>

                        <div class="col-12">
                            <button class="btn w-100" type="submit"
                                style="background-color:#6f42c1; color:white;">Обчислити 2</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- RESULT BLOCK -->
            {{if .Result}}
            <div class="mt-4 p-4 bg-light border rounded-3">
                <h5>Результат:</h5>
                <pre>{{.Result}}</pre>
            </div>
            {{end}}

        </div>
    </div>

</body>

</html>
