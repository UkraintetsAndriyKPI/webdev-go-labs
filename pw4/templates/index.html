<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Electrical Calculators</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5">

<div class="container">
    <div class="card shadow-lg rounded-4 p-4 mx-auto" style="max-width: 800px;">
        <h1 class="text-center mb-4">Electrical Calculators</h1>

        <!-- Nav tabs -->
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <button class="nav-link {{if eq .ActiveTab "calc1"}}active{{end}}"
                        data-bs-toggle="tab"
                        data-bs-target="#calc1">
                    Cable Selection
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link {{if eq .ActiveTab "calc2"}}active{{end}}"
                        data-bs-toggle="tab"
                        data-bs-target="#calc2">
                    Short Circuit K1
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link {{if eq .ActiveTab "calc3"}}active{{end}}"
                        data-bs-toggle="tab"
                        data-bs-target="#calc3">
                    Bus Short Circuit
                </button>
            </li>
        </ul>

        <div class="tab-content">

            <!-- CALC 1 -->
            <div class="tab-pane fade {{if eq .ActiveTab "calc1"}}show active{{end}}" id="calc1">
                <form method="POST" action="/calculate1" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Electric Current (kA)</label>
                        <input type="number" class="form-control" name="electricCurrent" step="any" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Load (kW)</label>
                        <input type="number" class="form-control" name="load" step="any" required>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary w-100">Calculate</button>
                    </div>
                </form>
            </div>

            <!-- CALC 2 -->
            <div class="tab-pane fade {{if eq .ActiveTab "calc2"}}show active{{end}}" id="calc2">
                <form method="POST" action="/calculate2" class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Transformer Power (MVA)</label>
                        <input type="number" class="form-control" name="powerMBA" step="any" required>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success w-100">Calculate</button>
                    </div>
                </form>
            </div>

            <!-- CALC 3 -->
            <div class="tab-pane fade {{if eq .ActiveTab "calc3"}}show active{{end}}" id="calc3">
                <form method="POST" action="/calculate3" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Resistance Max</label>
                        <input type="number" class="form-control" name="resistanceMax" step="any" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Voltage (kV)</label>
                        <input type="number" class="form-control" name="resistanceBH" step="any" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rcn (Normal)</label>
                        <input type="number" class="form-control" name="valueRcn" step="any" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Xcn (Normal)</label>
                        <input type="number" class="form-control" name="valueXcn" step="any" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rcn (Min)</label>
                        <input type="number" class="form-control" name="valueRcnMIN" step="any" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Xcn (Min)</label>
                        <input type="number" class="form-control" name="valueXcnMIN" step="any" required>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-danger w-100">Calculate</button>
                    </div>
                </form>
            </div>

        </div>

        {{if .Result}}
        <div class="mt-4 p-4 bg-light border rounded-3">
            <h5>Result:</h5>
            <pre>{{.Result}}</pre>
        </div>
        {{end}}

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
