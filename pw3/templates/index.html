<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Power Station Profit Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5">

<div class="container">
    <div class="card shadow-lg rounded-4 p-4 mx-auto" style="max-width: 700px;">
        <h1 class="text-center mb-4">Power Station Profit Calculator</h1>

        <form method="POST" action="/calculate" class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Average Daily Power</label>
                <input type="number"
                       class="form-control"
                       name="avgDayPower"
                       value="{{.Input.AvgDayPower}}"
                       step="any"
                       required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Standard Deviation</label>
                <input type="number"
                       class="form-control"
                       name="standardDeviation"
                       value="{{.Input.StandardDeviation}}"
                       step="any"
                       required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Electricity Price</label>
                <input type="number"
                       class="form-control"
                       name="electricityPrice"
                       value="{{.Input.ElectricityPrice}}"
                       step="any"
                       required>
            </div>

            <div class="col-12">
                <button class="btn btn-primary w-100" type="submit">
                    Calculate
                </button>
            </div>
        </form>

        {{if .Result}}
        <div class="mt-4 p-4 bg-light border rounded-3">
            <h5>Result:</h5>
            <pre>{{.Result}}</pre>
        </div>
        {{end}}

    </div>
</div>

</body>
</html>
